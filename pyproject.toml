[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "examsuite-importer"
version = "0.1.0"
description = "Importer for the ByteNol-ExamSuite system."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "python-docx>=1.2.0",
    "omml2latex>=0.1.1",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
